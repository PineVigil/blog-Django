# ============================================================
# toflower blog · Nginx 配置
# 域名:toflower.fun  IP:150.109.76.168
# 部署路径:/etc/nginx/sites-available/toflower.fun
# 启用:ln -s /etc/nginx/sites-available/toflower.fun /etc/nginx/sites-enabled/
# 重载:nginx -t && systemctl reload nginx
# ============================================================

# 后端 Gunicorn 上游(本机 Unix socket,性能更佳)
upstream toflower_app {
    server unix:/var/www/toflower_blog/run/gunicorn.sock fail_timeout=0;
    # 或使用 TCP:# server 127.0.0.1:8000 fail_timeout=0;
}

# ---------- HTTP:跳转 HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name toflower.fun www.toflower.fun 150.109.76.168;

    # Let's Encrypt 证书签发时使用
    location /.well-known/acme-challenge/ {
        root /var/www/toflower_blog/staticfiles;
    }

    # 其余请求跳转到 HTTPS(签发证书后启用)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS:主站 ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name toflower.fun www.toflower.fun;

    # SSL 证书(签发后填入)
    ssl_certificate     /etc/letsencrypt/live/toflower.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/toflower.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 字符集
    charset utf-8;

    # 站点根目录
    root /var/www/toflower_blog;
    client_max_body_size 16M;   # 允许上传封面图

    # ---------- 日志 ----------
    access_log /var/log/nginx/toflower_access.log;
    error_log  /var/log/nginx/toflower_error.log;

    # ---------- 静态文件(Nginx 直接处理) ----------
    location /static/ {
        alias /var/www/toflower_blog/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---------- 媒体文件(用户上传) ----------
    location /media/ {
        alias /var/www/toflower_blog/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---------- favicon / robots ----------
    location = /favicon.ico {
        alias /var/www/toflower_blog/staticfiles/images/favicon.svg;
        access_log off;
        log_not_found off;
    }
    location = /robots.txt {
        proxy_pass http://toflower_app;
        access_log off;
    }

    # ---------- Gzip 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/woff2;

    # ---------- 安全头 ----------
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ---------- Django 动态请求 ----------
    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 30s;

        # 静态资源不进 Django
        try_files $uri @django;
    }

    location @django {
        proxy_pass http://toflower_app;
    }
}
