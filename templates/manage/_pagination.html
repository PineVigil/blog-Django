{# 通用分页片段:依赖上下文 page_obj 与 qs(已剔除 page 参数的查询串) #}
{% if page_obj.has_other_pages %}
<nav class="pagination">
    {% if page_obj.has_previous %}
    <a href="?page={{ page_obj.previous_page_number }}{% if qs %}&{{ qs }}{% endif %}" class="page-btn">&larr; 上一页</a>
    {% endif %}
    <span class="page-info">第 {{ page_obj.number }} / {{ page_obj.paginator.num_pages }} 页 · 共 {{ page_obj.paginator.count }} 条</span>
    {% if page_obj.has_next %}
    <a href="?page={{ page_obj.next_page_number }}{% if qs %}&{{ qs }}{% endif %}" class="page-btn">下一页 &rarr;</a>
    {% endif %}
</nav>
{% endif %}
